<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场 MT4 指标研究</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d141c; color: #e6edf3; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 20px; }
    .topbar { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .board-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid #243241; }
    .board-tab { background:transparent; border:0; border-bottom:2px solid transparent; border-radius:0; color:#8b9bab; padding:10px 16px; }
    .board-tab.active { color:#e6edf3; border-bottom-color:#1c78d0; }
    .title { margin-right: auto; }
    .eyebrow { margin: 0 0 5px; color: #7f92a5; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 25px; font-weight: 600; }
    label { display: grid; gap: 5px; color: #8b9bab; font-size: 12px; }
    input, button { border: 1px solid #263646; background: #121c27; color: #e6edf3; padding: 8px 10px; border-radius: 5px; font: inherit; }
    button { cursor: pointer; background: #1c78d0; border-color: #1c78d0; }
    .indicator-strip { border: 1px solid #243241; background: #111a24; padding: 10px 12px; margin-bottom: 12px; color: #8b9bab; font-size: 13px; }
    .indicator-strip strong { color: #e6edf3; font-weight: 500; margin-left: 8px; }
    #status { min-height: 22px; color: #8b9bab; font-size: 13px; }
    .chart-card { border: 1px solid #243241; background: #111a24; margin-top: 12px; }
    .chart-header { display: flex; justify-content: space-between; padding: 12px 16px 0; font-size: 14px; }
    .chart-header span:last-child { color: #8b9bab; }
    .chart { height: 560px; width: 100%; }
    .detail { min-height: 35px; border-top: 1px solid #243241; padding: 9px 16px; color: #8b9bab; font-size: 12px; }
    .error { color: #ff7b72 !important; }
    @media (max-width: 720px) { .shell { padding: 10px; } .chart { height: 440px; } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="board-tabs" aria-label="市场板块">
      {% for key, board in boards.items() %}<button class="board-tab{% if key == default_board %} active{% endif %}" data-board="{{ key }}" type="button">{{ board.label }}</button>{% endfor %}
    </nav>
    <header class="topbar">
      <div class="title"><p id="source-label" class="eyebrow"></p><h1 id="symbol-label"></h1></div>
      <label>开始日期<input id="date-start" type="date"></label>
      <label>结束日期<input id="date-end" type="date"></label>
      <button id="load" type="button">重新加载</button>
    </header>
    <section class="indicator-strip">MT4 指标映射<strong>HA SMMA6/LWMA2 · ZigZag D30 Dev3 B3 · SAR 0.016/0.2</strong></section>
    <div id="status" role="status"></div>
    <section class="chart-card">
      <div class="chart-header"><span>1 分钟 K 线</span><span id="count-1m">0 bars</span></div>
      <div id="chart-1m" class="chart"></div><div id="detail-1m" class="detail">移动鼠标查看 1m OHLCV 与指标</div>
    </section>
    <section class="chart-card">
      <div class="chart-header"><span>5 分钟 K 线</span><span id="count-5m">0 bars</span></div>
      <div id="chart-5m" class="chart"></div><div id="detail-5m" class="detail">移动鼠标查看 5m OHLCV 与指标</div>
    </section>
  </main>
<script>
const indicatorConfig={{ indicator_config|tojson }};
const boards={{ boards|tojson }};
let activeBoard={{ default_board|tojson }};
const charts={"1m":echarts.init(document.getElementById('chart-1m')),"5m":echarts.init(document.getElementById('chart-5m'))};
const zoomState={"1m":{start:75,end:100},"5m":{start:75,end:100}};
function num(v){return Number(v)}
function price(v){return v===null||v===undefined||Number.isNaN(num(v))?'--':num(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:4})}
function dt(ms){const d=new Date(ms);return d.toLocaleString('zh-CN',{hour12:false})}
function minute(ms){return new Date(ms).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function movingAverage(values,period,method){const out=Array(values.length).fill(null),m=String(method).toUpperCase();if(m==='LWMA'){const ws=period*(period+1)/2;for(let i=period-1;i<values.length;i++){let s=0,ok=true;for(let j=0;j<period;j++){if(values[i-j]===null){ok=false;break}s+=num(values[i-j])*(period-j)}if(ok)out[i]=s/ws}return out}if(m==='SMMA'){let sum=0,n=0;for(let i=0;i<values.length;i++){if(values[i]===null){sum=0;n=0;continue}sum+=num(values[i]);n++;if(n===period&&out[i-1]===null)out[i]=sum/period;else if(n>period)out[i]=(out[i-1]*(period-1)+num(values[i]))/period}return out}return out}
function smooth(ohlc,p,m){const keys=['open','high','low','close'],cols=Object.fromEntries(keys.map(k=>[k,movingAverage(ohlc.map(x=>x?.[k]??null),p,m)]));return ohlc.map((_,i)=>keys.some(k=>cols[k][i]===null)?null:Object.fromEntries(keys.map(k=>[k,cols[k][i]])))}
function heiken(bars){const c=indicatorConfig.heiken_ashi;const first=smooth(bars.map(b=>({open:num(b.open),high:num(b.high),low:num(b.low),close:num(b.close)})),num(c.ma1_period),c.ma1_method);const ha=Array(bars.length).fill(null);for(let i=0;i<first.length;i++){const x=first[i];if(!x)continue;const close=(x.open+x.high+x.low+x.close)/4,prev=ha[i-1],open=prev?(prev.open+prev.close)/2:(x.open+x.close)/2;ha[i]={open,high:Math.max(x.high,open,close),low:Math.min(x.low,open,close),close}}return smooth(ha,num(c.ma2_period),c.ma2_method).map(x=>x?[x.open,x.close,x.low,x.high]:['-','-','-','-'])}
function zigzag(bars){const c=indicatorConfig.zigzag,depth=Math.max(1,num(c.depth)),back=Math.max(0,num(c.backstep)),minMove=Math.max(0,num(c.deviation))*Math.max(0,num(c.price_tick_size)),pivots=[],confirmedEnd=bars.length-1-depth;for(let i=0;i<=confirmedEnd;i++){const left=Math.max(0,i-depth),right=Math.min(bars.length-1,i+depth),high=num(bars[i].high),low=num(bars[i].low);let isH=true,isL=true;for(let j=left;j<=right;j++){if(num(bars[j].high)>high)isH=false;if(num(bars[j].low)<low)isL=false;if(!isH&&!isL)break}const cand=[];if(isH)cand.push({index:i,value:high,type:'high'});if(isL)cand.push({index:i,value:low,type:'low'});for(const x of cand){const prev=pivots.at(-1);if(!prev){pivots.push(x);continue}if(Math.abs(x.value-prev.value)<minMove)continue;if(x.type===prev.type){const extreme=x.type==='high'?x.value>prev.value:x.value<prev.value;if(extreme||x.index-prev.index<=back)pivots[pivots.length-1]=x}else pivots.push(x)}}if(c.show_unconfirmed!==false&&pivots.length){const last=pivots.at(-1),threshold=Math.max(minMove,Math.abs(last.value)*(num(c.live_reversal_percent)/100),num(c.live_reversal_abs));let lp=null;for(let i=last.index+1;i<bars.length;i++){const value=last.type==='high'?num(bars[i].low):num(bars[i].high),type=last.type==='high'?'low':'high';if(!lp||(type==='high'?value>lp.value:value<lp.value))lp={index:i,value,type}}if(lp&&Math.abs(lp.value-last.value)>=threshold)pivots.push(lp)}const line=Array(bars.length).fill(null);for(let k=1;k<pivots.length;k++){const a=pivots[k-1],b=pivots[k],span=b.index-a.index;if(span<=0)continue;for(let i=a.index;i<=b.index;i++)line[i]=a.value+(b.value-a.value)*(i-a.index)/span}return line}
function psar(bars){const c=indicatorConfig.parabolic_sar;if(bars.length<2)return Array(bars.length).fill('-');const step=num(c.step),max=num(c.maximum),out=Array(bars.length).fill('-');let long=num(bars[1].close)>=num(bars[0].close),af=step,ep=long?num(bars[1].high):num(bars[1].low),sar=long?num(bars[0].low):num(bars[0].high);out[1]=sar;for(let i=2;i<bars.length;i++){const h=num(bars[i].high),l=num(bars[i].low);sar+=af*(ep-sar);if(long){sar=Math.min(sar,num(bars[i-1].low),num(bars[i-2].low));if(l<sar){long=false;sar=ep;ep=l;af=step}else if(h>ep){ep=h;af=Math.min(af+step,max)}}else{sar=Math.max(sar,num(bars[i-1].high),num(bars[i-2].high));if(h>sar){long=true;sar=ep;ep=h;af=step}else if(l<ep){ep=l;af=Math.min(af+step,max)}}out[i]=sar}return out}
function strategySignals(one,five){const ha=heiken(one),sar=psar(one),trend=zigzag(five),entries=[],exits=[],stops=[],targets=[],trades=[];let fiveIndex=-1,lastStop=null,previousLong=false,position=null,pullback=false,pullbackStop=null;for(let i=0;i<one.length;i++){const bar=one[i],close=num(bar.close),sarValue=sar[i]==='-'?null:num(sar[i]),isLong=sarValue!==null&&sarValue<close;if(isLong&&!previousLong&&ha[i]&&ha[i][2]!=='-')lastStop=num(ha[i][2]);previousLong=isLong;while(fiveIndex+1<five.length&&num(five[fiveIndex+1].end_ts)<=num(bar.end_ts))fiveIndex++;if(position){const stopHit=num(bar.low)<=position.stop,targetHit=num(bar.high)>=position.target;if(stopHit||targetHit){const reason=stopHit?'SL':'TP',exitPrice=stopHit?position.stop:position.target,trade={...position,exitIndex:i,exitTs:bar.end_ts,exitPrice,reason};trades.push(trade);exits.push({value:[i,exitPrice],trade});position=null;pullback=false;pullbackStop=null}continue}const fiveUp=fiveIndex>0&&trend[fiveIndex]!==null&&trend[fiveIndex-1]!==null&&trend[fiveIndex]>trend[fiveIndex-1];if(!fiveUp){pullback=false;pullbackStop=null;continue}if(i===0)continue;const previous=one[i-1],bodyBelow=num(bar.open)<num(previous.open)&&close<num(previous.close),bodyAbove=num(bar.open)>num(previous.open)&&close>num(previous.close),haBlue=ha[i]&&ha[i][0]!=='-'&&num(ha[i][1])>num(ha[i][0]),candleUp=close>num(bar.open);if(!pullback&&bodyBelow&&lastStop!==null){pullback=true;pullbackStop=lastStop;continue}if(pullback&&bodyAbove&&haBlue&&candleUp&&pullbackStop!==null&&pullbackStop<close){const target=close+2*(close-pullbackStop);position={entryIndex:i,entryTs:bar.end_ts,entryPrice:close,stop:pullbackStop,target};entries.push({value:[i,close],trade:position});stops.push({value:[i,pullbackStop],trade:position});targets.push({value:[i,target],trade:position});pullback=false;pullbackStop=null}}return{entries,exits,stops,targets,trades,open:position}}
function option(interval,bars,strategy=null){const cats=bars.map(b=>minute(b.start_ts)),ohlc=bars.map(b=>[num(b.open),num(b.close),num(b.low),num(b.high)]),vol=bars.map((b,i)=>[i,num(b.volume),num(b.close)>=num(b.open)?1:-1]),ha=heiken(bars),zz=zigzag(bars),sar=psar(bars),strategySeries=strategy?[{name:'进场',type:'scatter',data:strategy.entries,symbol:'triangle',symbolSize:13,itemStyle:{color:'#39d98a'}},{name:'出场',type:'scatter',data:strategy.exits,symbol:'diamond',symbolSize:13,itemStyle:{color:p=>p.data.trade.reason==='TP'?'#28c76f':'#ff5c5c'}},{name:'止损',type:'scatter',data:strategy.stops,symbol:'pin',symbolSize:11,itemStyle:{color:'#ff5c5c'}},{name:'止盈',type:'scatter',data:strategy.targets,symbol:'pin',symbolRotate:180,symbolSize:11,itemStyle:{color:'#28c76f'}}]:[];return{animation:false,backgroundColor:'transparent',tooltip:{trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'rgba(17,24,33,.96)',borderColor:'#243241',textStyle:{color:'#e6edf3'},formatter(params){const p=params.find(x=>x.seriesName==='OHLC');if(!p)return'';const b=bars[p.dataIndex],marks=params.filter(x=>x.data?.trade).map(x=>`${x.seriesName} ${price(x.value[1])}${x.data.trade.reason?' '+x.data.trade.reason:''}`).join('<br>');document.getElementById(`detail-${interval}`).textContent=`${interval} ${dt(b.start_ts)} | O ${price(b.open)} H ${price(b.high)} L ${price(b.low)} C ${price(b.close)} V ${num(b.volume).toLocaleString()} trades ${b.trade_count}`;return `${interval} ${dt(b.start_ts)}<br>O ${price(b.open)} H ${price(b.high)}<br>L ${price(b.low)} C ${price(b.close)}<br>V ${num(b.volume).toLocaleString()} trades ${b.trade_count}<br>SAR ${price(sar[p.dataIndex])}${marks?'<br>'+marks:''}`}},legend:{top:0,right:24,textStyle:{color:'#8b9bab'}},axisPointer:{link:[{xAxisIndex:'all'}]},grid:[{left:68,right:24,top:32,height:'61%'},{left:68,right:24,top:'75%',height:'12%'}],xAxis:[{type:'category',data:cats,boundaryGap:true,axisLine:{lineStyle:{color:'#243241'}},axisLabel:{color:'#8b9bab',hideOverlap:true},splitLine:{show:false}},{type:'category',gridIndex:1,data:cats,boundaryGap:true,axisLabel:{show:false},axisLine:{lineStyle:{color:'#243241'}}}],yAxis:[{scale:true,axisLabel:{color:'#8b9bab'},splitLine:{lineStyle:{color:'#243241'}}},{scale:true,gridIndex:1,axisLabel:{color:'#8b9bab'},splitLine:{show:false}}],dataZoom:[{type:'inside',xAxisIndex:[0,1],...zoomState[interval]},{show:true,type:'slider',xAxisIndex:[0,1],...zoomState[interval],bottom:5,height:20,borderColor:'#243241',textStyle:{color:'#8b9bab'}}],series:[{name:'OHLC',type:'candlestick',data:ohlc,itemStyle:{color:'#24b47e',color0:'#f05d5e',borderColor:'#24b47e',borderColor0:'#f05d5e'}},{name:'Smoothed HA',type:'candlestick',data:ha,barWidth:'38%',itemStyle:{color:'DodgerBlue',color0:'DeepPink',borderColor:'DodgerBlue',borderColor0:'DeepPink',opacity:.72}},{name:'ZigZag',type:'line',data:zz,connectNulls:false,showSymbol:false,lineStyle:{color:'#f6c350',width:2}},{name:'Parabolic SAR',type:'scatter',data:sar,symbolSize:5,itemStyle:{color:'#fff'}},{name:'Volume',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vol,itemStyle:{color:p=>p.value[2]>=0?'#24b47e':'#f05d5e'}},...strategySeries]}}
async function loadInterval(interval,start,end){const q=new URLSearchParams({board:activeBoard,interval,date_start:start,date_end:end});const r=await fetch(`/api/bars?${q}`),p=await r.json();if(!p.ok)throw new Error(`${interval}: ${p.error}`);document.getElementById(`count-${interval}`).textContent=`${p.total_rows.toLocaleString()} bars`;return p}
async function loadAll(){const s=document.getElementById('date-start').value,e=document.getElementById('date-end').value,status=document.getElementById('status');status.className='';status.textContent='正在读取数据…';try{const p=await Promise.all([loadInterval('1m',s,e),loadInterval('5m',s,e)]),strategy=activeBoard==='forex'?strategySignals(p[0].rows,p[1].rows):null;charts['1m'].setOption(option('1m',p[0].rows,strategy),true);charts['5m'].setOption(option('5m',p[1].rows),true);status.textContent=`读取完成：1m ${p[0].total_rows.toLocaleString()} bars，5m ${p[1].total_rows.toLocaleString()} bars${strategy?`；策略标记 ${strategy.trades.length} 笔${strategy.open?'，另有 1 笔未平仓':''}`:''}`}catch(err){status.className='error';status.textContent=`读取失败：${err.message}`}}
function selectBoard(key,load=true){activeBoard=key;const b=boards[key];document.getElementById('source-label').textContent=b.source_label;document.getElementById('symbol-label').textContent=b.symbol;document.getElementById('date-start').value=b.date_start;document.getElementById('date-end').value=b.date_end;document.querySelectorAll('.board-tab').forEach(x=>x.classList.toggle('active',x.dataset.board===key));Object.values(charts).forEach(c=>c.clear());for(const i of ['1m','5m'])document.getElementById(`count-${i}`).textContent='0 bars';if(load)loadAll()}
document.querySelectorAll('.board-tab').forEach(x=>x.addEventListener('click',()=>selectBoard(x.dataset.board)));
document.getElementById('load').addEventListener('click',loadAll);window.addEventListener('resize',()=>Object.values(charts).forEach(c=>c.resize()));selectBoard(activeBoard);
</script>
</body></html>
