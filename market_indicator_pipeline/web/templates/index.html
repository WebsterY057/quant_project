<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>市场 MT4 指标研究</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d141c; color: #e6edf3; }
    .shell { max-width: 1500px; margin: 0 auto; padding: 20px; }
    .topbar { display: flex; align-items: end; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
    .board-tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid #243241; }
    .board-tab { background:transparent; border:0; border-bottom:2px solid transparent; border-radius:0; color:#8b9bab; padding:10px 16px; }
    .board-tab.active { color:#e6edf3; border-bottom-color:#1c78d0; }
    .title { margin-right: auto; }
    .eyebrow { margin: 0 0 5px; color: #7f92a5; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 0; font-size: 25px; font-weight: 600; }
    label { display: grid; gap: 5px; color: #8b9bab; font-size: 12px; }
    input, button { border: 1px solid #263646; background: #121c27; color: #e6edf3; padding: 8px 10px; border-radius: 5px; font: inherit; }
    button { cursor: pointer; background: #1c78d0; border-color: #1c78d0; }
    .indicator-strip { border: 1px solid #243241; background: #111a24; padding: 10px 12px; margin-bottom: 12px; color: #8b9bab; font-size: 13px; }
    .indicator-strip strong { color: #e6edf3; font-weight: 500; margin-left: 8px; }
    #status { min-height: 22px; color: #8b9bab; font-size: 13px; }
    .metrics { display:grid; grid-template-columns:repeat(6,minmax(120px,1fr)); gap:8px; margin-top:12px; }
    .metric { border:1px solid #243241; background:#111a24; padding:10px 12px; }
    .metric span { display:block; color:#8b9bab; font-size:11px; margin-bottom:4px; }
    .metric strong { font-size:16px; font-weight:600; }
    .trade-details { margin-top:10px; border:1px solid #243241; background:#111a24; }
    .trade-details summary { cursor:pointer; padding:10px 12px; color:#e6edf3; }
    .trade-table-wrap { overflow:auto; max-height:440px; border-top:1px solid #243241; }
    .trade-table { width:100%; border-collapse:collapse; white-space:nowrap; font-size:12px; }
    .trade-table th,.trade-table td { padding:7px 9px; border-bottom:1px solid #1c2936; text-align:right; }
    .trade-table th { position:sticky; top:0; background:#15202b; color:#8b9bab; z-index:1; }
    .trade-table th:nth-child(-n+3),.trade-table td:nth-child(-n+3) { text-align:left; }
    .profit-positive { color:#28c76f; } .profit-negative { color:#ff5c5c; }
    .charts-grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:12px; }
    .chart-card { border: 1px solid #243241; background: #111a24; margin-top: 12px; }
    .chart-header { display: flex; justify-content: space-between; padding: 12px 16px 0; font-size: 14px; }
    .chart-header span:last-child { color: #8b9bab; }
    .chart { height: 520px; width: 100%; }
    .detail { min-height: 35px; border-top: 1px solid #243241; padding: 9px 16px; color: #8b9bab; font-size: 12px; }
    .error { color: #ff7b72 !important; }
    @media (max-width: 1000px) { .charts-grid { grid-template-columns:1fr; } }
    @media (max-width: 720px) { .shell { padding: 10px; } .chart { height: 440px; } .metrics { grid-template-columns:repeat(2,1fr); } }
  </style>
</head>
<body>
  <main class="shell">
    <nav class="board-tabs" aria-label="市场板块">
      {% for key, board in boards.items() %}<button class="board-tab{% if key == default_board %} active{% endif %}" data-board="{{ key }}" type="button">{{ board.label }}</button>{% endfor %}
    </nav>
    <header class="topbar">
      <div class="title"><p id="source-label" class="eyebrow"></p><h1 id="symbol-label"></h1></div>
      <label>开始日期<input id="date-start" type="date"></label>
      <label>结束日期<input id="date-end" type="date"></label>
      <button id="load" type="button">重新加载</button>
    </header>
    <section class="indicator-strip">MT4 指标映射<strong>HA SMMA6/LWMA2 · ZigZag 确认时间可见：1m 前序段反转 D30 Dev5 B3 · 5m D12 Dev5 B3 · SAR 0.016/0.2</strong></section>
    <div id="status" role="status"></div>
    <section id="metrics" class="metrics" aria-label="策略回测统计"></section>
    <details id="trade-details" class="trade-details"><summary id="trade-summary">交易明细（0 笔）</summary><div class="trade-table-wrap"><table class="trade-table"><thead><tr><th>#</th><th>方向</th><th>进场时间</th><th>进场价</th><th>止损</th><th>止盈</th><th>出场时间</th><th>出场价</th><th>结果</th><th>盈亏</th><th>手续费</th></tr></thead><tbody id="trade-rows"></tbody></table></div></details>
    <div class="charts-grid">
      <section class="chart-card">
        <div class="chart-header"><span>1 分钟 K 线</span><span id="count-1m">0 bars</span></div>
        <div id="chart-1m" class="chart"></div><div id="detail-1m" class="detail">移动鼠标查看 1m OHLCV 与指标</div>
      </section>
      <section class="chart-card">
        <div class="chart-header"><span>5 分钟 K 线</span><span id="count-5m">0 bars</span></div>
        <div id="chart-5m" class="chart"></div><div id="detail-5m" class="detail">移动鼠标查看 5m OHLCV 与指标</div>
      </section>
    </div>
  </main>
<script>

function zigzag(bars,interval='1m'){const base=indicatorConfig.zigzag,c={...base,...(base.intervals?.[interval]||{})},depth=Math.max(1,num(c.depth)),back=Math.max(0,num(c.backstep)),minMove=Math.max(0,num(c.deviation))*Math.max(0,num(c.price_tick_size)),pivots=[],confirmedEnd=bars.length-1-depth;for(let i=0;i<=confirmedEnd;i++){const left=Math.max(0,i-depth),right=i+depth,high=num(bars[i].high),low=num(bars[i].low);let isH=true,isL=true;for(let j=left;j<=right;j++){if(num(bars[j].high)>high)isH=false;if(num(bars[j].low)<low)isL=false;if(!isH&&!isL)break}const cand=[];if(isH)cand.push({index:i+depth,pivotIndex:i,value:high,type:'high',confirmed:true});if(isL)cand.push({index:i+depth,pivotIndex:i,value:low,type:'low',confirmed:true});for(const x of cand){const prev=pivots.at(-1);if(!prev){pivots.push(x);continue}if(Math.abs(x.value-prev.value)<minMove)continue;if(x.type===prev.type){const extreme=x.type==='high'?x.value>prev.value:x.value<prev.value;if(extreme||x.pivotIndex-prev.pivotIndex<=back)pivots[pivots.length-1]=x}else pivots.push(x)}}const displayPivots=[...pivots];if(c.show_unconfirmed!==false&&pivots.length){const last=pivots.at(-1),threshold=Math.max(minMove,Math.abs(last.value)*(num(c.live_reversal_percent)/100),num(c.live_reversal_abs));let lp=null;for(let i=last.pivotIndex+1;i<bars.length;i++){const value=last.type==='high'?num(bars[i].low):num(bars[i].high),type=last.type==='high'?'low':'high';if(!lp||(type==='high'?value>lp.value:value<lp.value))lp={index:i,pivotIndex:i,value,type,confirmed:false}}if(lp&&Math.abs(lp.value-last.value)>=threshold)displayPivots.push(lp)}const line=Array(bars.length).fill(null);for(let k=1;k<displayPivots.length;k++){const a=displayPivots[k-1],b=displayPivots[k],ai=a.pivotIndex,bi=b.pivotIndex,span=bi-ai;if(span<=0)continue;for(let i=ai;i<=bi;i++)line[i]=a.value+(b.value-a.value)*(i-ai)/span}line.pivots=pivots;line.displayPivots=displayPivots;return line}

function confirmedTrendEvidence(one,five,entryIndex){const entryEnd=num(one[entryIndex].end_ts),fiveIndex=five.findLastIndex(x=>num(x.end_ts)<=entryEnd),pivots=zigzag(five,'5m').pivots||[],highs=[],lows=[];let highStructure=null,lowStructure=null;for(const p of pivots){if(p.index>fiveIndex)break;const points=p.type==='high'?highs:lows;points.push(p);if(points.length>2)points.shift();if(points.length===2){if(p.type==='high')highStructure=points[1].value>points[0].value?'up':'down';else lowStructure=points[1].value>points[0].value?'up':'down'}}const fiveDirection=highStructure==='up'&&lowStructure==='up'?'long':highStructure==='down'&&lowStructure==='down'?'short':'neutral',entryPivots=zigzag(one,'1m').pivots||[];let lastPivot=null;for(const p of entryPivots){if(p.index>entryIndex)break;lastPivot=p}return{fiveDirection,priorLegDirection:lastPivot?(lastPivot.type==='low'?'up':'down'):'neutral',oneDirection:lastPivot?(lastPivot.type==='low'?'short':'long'):'neutral',sarDirection:psar(one)[entryIndex]<num(one[entryIndex].close)?'long':'short',pivotTime:lastPivot?one[lastPivot.pivotIndex].start_ts:null,confirmationTime:lastPivot?one[lastPivot.index].end_ts:null,visibility:'confirmed_prior_leg_reversal'}}
function confirmedFiveMinuteRegimes(one,five){const pivots=zigzag(five,'5m').pivots||[],highs=[],lows=[],regimes=[];let fiveIndex=-1,pivotCursor=0,highStructure=null,lowStructure=null,channel=null,active=null;for(let i=0;i<one.length;i++){while(fiveIndex+1<five.length&&num(five[fiveIndex+1].end_ts)<=num(one[i].end_ts))fiveIndex++;while(pivotCursor<pivots.length&&pivots[pivotCursor].index<=fiveIndex){const p=pivots[pivotCursor++],points=p.type==='high'?highs:lows;points.push(p);if(points.length>2)points.shift();if(points.length===2){if(p.type==='high')highStructure=points[1].value>points[0].value?'up':'down';else lowStructure=points[1].value>points[0].value?'up':'down'}}const next=highStructure==='up'&&lowStructure==='up'?'long':highStructure==='down'&&lowStructure==='down'?'short':null;if(next!==channel){if(active){active.endIndex=i-1;regimes.push(active)}channel=next;active=channel?{direction:channel,startIndex:i,endIndex:i}:null}else if(active)active.endIndex=i}if(active)regimes.push(active);return regimes}
function backtestMetrics(strategy){const notional=num(backtestConfig.notional_per_trade_usd),fee=num(backtestConfig.fee_rate_per_side),slippage=num(backtestConfig.slippage_rate_per_side);let volume=0,fees=0,profit=0;for(const t of strategy.trades){const quantity=notional/t.entryPrice,entryFill=t.direction==='long'?t.entryPrice*(1+slippage):t.entryPrice*(1-slippage),exitFill=t.direction==='long'?t.exitPrice*(1-slippage):t.exitPrice*(1+slippage),gross=quantity*(t.direction==='long'?(exitFill-entryFill):(entryFill-exitFill)),tradeVolume=quantity*(entryFill+exitFill),tradeFee=tradeVolume*fee,net=gross-tradeFee;volume+=tradeVolume;fees+=tradeFee;profit+=net;t.backtest={notional,quantity,gross,fee:tradeFee,net}}return{notional,volume,fees,profit,count:strategy.trades.length,wins:strategy.trades.filter(t=>t.backtest.net>0).length,winRate:strategy.trades.length?strategy.trades.filter(t=>t.backtest.net>0).length/strategy.trades.length:0,open:strategy.open?1:0}}
function renderMetrics(metrics){const items=[['成交量',`$${metrics.volume.toFixed(2)}`],['盈亏',`${metrics.profit>=0?'+':''}$${metrics.profit.toFixed(2)}`],['手续费',`$${metrics.fees.toFixed(2)}`],['交易笔数',metrics.count.toLocaleString()],['胜率',`${(metrics.winRate*100).toFixed(2)}%`],['每笔交易金额',`$${metrics.notional.toFixed(2)}`]];document.getElementById('metrics').innerHTML=items.map(([k,v])=>`<div class="metric"><span>${k}</span><strong>${v}</strong></div>`).join('')}
function renderTradeDetails(strategy){document.getElementById('trade-summary').textContent=`交易明细（${strategy.trades.length.toLocaleString()} 笔）`;document.getElementById('trade-rows').innerHTML=strategy.trades.map((t,i)=>`<tr><td>${i+1}</td><td>${t.direction==='long'?'做多':'做空'}</td><td>${dt(t.entryTs)}</td><td>${price(t.entryPrice)}</td><td>${price(t.stop)}</td><td>${price(t.target)}</td><td>${dt(t.exitTs)}</td><td>${price(t.exitPrice)}</td><td>${t.reason==='TP'?'止盈':'止损'}</td><td class="${t.backtest.net>=0?'profit-positive':'profit-negative'}">${t.backtest.net>=0?'+':''}$${t.backtest.net.toFixed(4)}</td><td>$${t.backtest.fee.toFixed(4)}</td></tr>`).join('')}
const strategySignalsBase=strategySignals;
strategySignals=function(one,five){const result=strategySignalsBase(one,five);for(const entry of result.entries)entry.trade.trend=confirmedTrendEvidence(one,five,entry.trade.entryIndex);result.regimes=confirmedFiveMinuteRegimes(one,five);return result}
function option(interval,bars,strategy=null){const cats=bars.map(b=>minute(b.start_ts)),ohlc=bars.map(b=>[num(b.open),num(b.close),num(b.low),num(b.high)]),vol=bars.map((b,i)=>[i,num(b.volume),num(b.close)>=num(b.open)?1:-1]),ha=heiken(bars),zz=zigzag(bars,interval),sar=psar(bars),maxSpan=interval==='1m'?900:700,openPosition=strategy?.open?{...strategy.open,exitIndex:bars.length-1}:null,stopPositions=strategy?[...strategy.trades.filter(t=>t.reason==='SL'),...(openPosition?[openPosition]:[])]:[],targetPositions=strategy?[...strategy.trades.filter(t=>t.reason==='TP'),...(openPosition?[openPosition]:[])]:[],stopLines=stopPositions.map(t=>({coords:[[t.entryIndex,t.stop],[t.exitIndex,t.stop]]})),targetLines=targetPositions.map(t=>({coords:[[t.entryIndex,t.target],[t.exitIndex,t.target]]})),regimeSeries=strategy?.regimes?.length?[{name:'5m 多空区间',type:'line',data:[],silent:true,z:0,markArea:{silent:true,label:{show:true,position:'insideTop',color:'#c9d4df',fontSize:10},data:strategy.regimes.map(r=>[{name:r.direction==='long'?'5m 做多':'5m 做空',xAxis:r.startIndex,itemStyle:{color:r.direction==='long'?'rgba(40,199,111,.10)':'rgba(255,92,92,.10)'}},{xAxis:r.endIndex}])}}]:[],strategySeries=strategy?[{name:'进场',type:'scatter',data:strategy.entries,symbol:'triangle',symbolSize:14,label:{show:true,position:'top',formatter:p=>p.data.trade.direction==='long'?'做多':'做空',color:p=>p.data.trade.direction==='long'?'#39d98a':'#ff9f43',fontWeight:700},itemStyle:{color:p=>p.data.trade.direction==='long'?'#39d98a':'#ff9f43'}},{name:'出场',type:'scatter',data:strategy.exits,symbol:'diamond',symbolSize:14,label:{show:true,position:'top',formatter:p=>p.data.trade.reason,color:'#e6edf3',fontWeight:700},itemStyle:{color:p=>p.data.trade.reason==='TP'?'#28c76f':'#ff5c5c'}},{name:'实际止损',type:'lines',coordinateSystem:'cartesian2d',polyline:false,data:stopLines,symbol:['none','none'],silent:true,lineStyle:{color:'#ff5c5c',width:1.8,type:'dashed',opacity:.95}},{name:'实际止盈',type:'lines',coordinateSystem:'cartesian2d',polyline:false,data:targetLines,symbol:['none','none'],silent:true,lineStyle:{color:'#28c76f',width:1.8,type:'dashed',opacity:.95}}]:[];return{animation:false,backgroundColor:'transparent',tooltip:{trigger:'axis',transitionDuration:0,axisPointer:{type:'cross',animation:false},backgroundColor:'rgba(17,24,33,.96)',borderColor:'#243241',textStyle:{color:'#e6edf3'},formatter(params){const p=params.find(x=>x.seriesName==='OHLC');if(!p)return'';const b=bars[p.dataIndex],marks=params.filter(x=>x.data?.trade).map(x=>`${x.seriesName} ${price(x.value[1])}${x.data.trade.reason?' '+x.data.trade.reason:''}`).join('<br>');document.getElementById(`detail-${interval}`).textContent=`${interval} ${dt(b.start_ts)} | O ${price(b.open)} H ${price(b.high)} L ${price(b.low)} C ${price(b.close)} V ${num(b.volume).toLocaleString()} trades ${b.trade_count}`;return `${interval} ${dt(b.start_ts)}<br>O ${price(b.open)} H ${price(b.high)}<br>L ${price(b.low)} C ${price(b.close)}<br>V ${num(b.volume).toLocaleString()} trades ${b.trade_count}<br>SAR ${price(sar[p.dataIndex])}${marks?'<br>'+marks:''}`}},legend:{top:0,right:24,textStyle:{color:'#8b9bab'}},axisPointer:{link:[{xAxisIndex:'all'}]},grid:[{left:68,right:24,top:32,height:'61%'},{left:68,right:24,top:'75%',height:'12%'}],xAxis:[{type:'category',data:cats,boundaryGap:true,axisLine:{lineStyle:{color:'#243241'}},axisLabel:{color:'#8b9bab',hideOverlap:true},splitLine:{show:false}},{type:'category',gridIndex:1,data:cats,boundaryGap:true,axisLabel:{show:false},axisLine:{lineStyle:{color:'#243241'}}}],yAxis:[{scale:true,axisLabel:{color:'#8b9bab'},splitLine:{lineStyle:{color:'#243241'}}},{scale:true,gridIndex:1,axisLabel:{color:'#8b9bab'},splitLine:{show:false}}],dataZoom:[{type:'inside',filterMode:'filter',maxValueSpan:maxSpan,xAxisIndex:[0,1],...zoomState[interval]},{show:true,type:'slider',filterMode:'filter',maxValueSpan:maxSpan,xAxisIndex:[0,1],...zoomState[interval],bottom:5,height:20,borderColor:'#243241',textStyle:{color:'#8b9bab'}}],series:[...regimeSeries,{name:'OHLC',type:'candlestick',data:ohlc,large:true,largeThreshold:600,progressive:600,itemStyle:{color:'#24b47e',color0:'#f05d5e',borderColor:'#24b47e',borderColor0:'#f05d5e'}},{name:'Smoothed HA',type:'candlestick',data:ha,large:true,largeThreshold:600,progressive:600,barWidth:'38%',itemStyle:{color:'#24b47e',color0:'#f05d5e',borderColor:'#24b47e',borderColor0:'#f05d5e',opacity:.72}},{name:'ZigZag',type:'line',data:zz,connectNulls:false,showSymbol:false,sampling:'lttb',lineStyle:{color:'#f6c350',width:2}},{name:'Parabolic SAR',type:'scatter',data:sar,large:true,largeThreshold:600,progressive:600,symbolSize:5,itemStyle:{color:'#fff'}},{name:'Volume',type:'bar',xAxisIndex:1,yAxisIndex:1,data:vol,large:true,largeThreshold:600,progressive:600,itemStyle:{color:p=>p.value[2]>=0?'#24b47e':'#f05d5e'}},...strategySeries]}}
const optionBase=option;
option=function(interval,bars,strategy=null){const result=optionBase(interval,bars,strategy),baseFormatter=result.tooltip.formatter;result.tooltip.formatter=params=>{let html=baseFormatter(params);const entry=params.find(x=>x.seriesName==='进场'&&x.data?.trade?.trend);if(entry){const t=entry.data.trade.trend,label=x=>x==='long'?'做多':x==='short'?'做空':'中性',slope=x=>x==='up'?'向上':x==='down'?'向下':'中性';html+=`<br><strong>趋势判断（确认时间可见）</strong><br>5m 结构：${label(t.fiveDirection)}<br>1m 前序 ZigZag：${slope(t.priorLegDirection)}<br>反转许可：${label(t.oneDirection)}<br>Parabolic：${label(t.sarDirection)}${t.pivotTime?`<br>已确认拐点：${dt(t.pivotTime)}<br>确认时间：${dt(t.confirmationTime)}`:''}`}return html};return result}
async function loadInterval(interval,start,end){const q=new URLSearchParams({board:activeBoard,interval,date_start:start,date_end:end});const r=await fetch(`/api/bars?${q}`),p=await r.json();if(!p.ok)throw new Error(`${interval}: ${p.error}`);document.getElementById(`count-${interval}`).textContent=`${p.total_rows.toLocaleString()} bars`;return p}
async function loadAll(){const s=document.getElementById('date-start').value,e=document.getElementById('date-end').value,status=document.getElementById('status');status.className='';status.textContent='正在读取数据…';document.getElementById('metrics').innerHTML='';document.getElementById('trade-summary').textContent='交易明细（加载中）';document.getElementById('trade-rows').innerHTML='';try{const p=await Promise.all([loadInterval('1m',s,e),loadInterval('5m',s,e)]),strategy=strategySignals(p[0].rows,p[1].rows),metrics=backtestMetrics(strategy);charts['1m'].setOption(option('1m',p[0].rows,strategy),true);charts['5m'].setOption(option('5m',p[1].rows),true);renderMetrics(metrics);renderTradeDetails(strategy);status.textContent=`读取完成：1m ${p[0].total_rows.toLocaleString()} bars，5m ${p[1].total_rows.toLocaleString()} bars；策略标记 ${strategy.trades.length} 笔${strategy.open?'，另有 1 笔未平仓':''}；每笔固定 $${metrics.notional.toFixed(2)}，无杠杆，费率/滑点 ${(num(backtestConfig.fee_rate_per_side)*100).toFixed(3)}%/${(num(backtestConfig.slippage_rate_per_side)*100).toFixed(3)}%`}catch(err){status.className='error';status.textContent=`读取失败：${err.message}`}}
function selectBoard(key,load=true){activeBoard=key;const b=boards[key];document.getElementById('source-label').textContent=b.source_label;document.getElementById('symbol-label').textContent=b.symbol;document.getElementById('date-start').value=b.date_start;document.getElementById('date-end').value=b.date_end;document.querySelectorAll('.board-tab').forEach(x=>x.classList.toggle('active',x.dataset.board===key));Object.values(charts).forEach(c=>c.clear());for(const i of ['1m','5m'])document.getElementById(`count-${i}`).textContent='0 bars';if(load)loadAll()}
