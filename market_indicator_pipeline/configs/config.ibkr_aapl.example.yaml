source:
  root: "s3://zly/us-equity/raw"
  path_template: "source={source}/asset_type={asset_type}/market={market}/symbol={symbol}/data_type={data_type}/date={date}/hour=*/*.{extension}"
  source: "ibkr"
  asset_type: "stock"
  market: "us"
  symbols: ["AAPL"]
  data_types: ["l1_trade"]
  format: "csv_zst"          # csv_zst 或 parquet；若真实文件不同请改这里
  timestamp_basis: "event_time"  # 待用源字段抽查确认
  timezone: "UTC"

date_range:
  start: "2026-08-01"
  end: "2026-08-10"         # 含首含尾

rustfs:
  endpoint_env: "RUSTFS_S3_ENDPOINT"
  access_key_env: "RUSTFS_S3_ACCESS_KEY"
  secret_key_env: "RUSTFS_S3_SECRET_KEY"
  region_env: "RUSTFS_S3_REGION"
  default_endpoint: "127.0.0.1:9001"
  default_region: "us-east-1"
  url_style: "path"
  use_ssl: false
  max_s3_inflight: 1

duckdb:
  path: "output/ibkr_us_equity.duckdb"
  schema: "raw"
  table: "ibkr_stock_us_l1_trade"
  threads: 2
  memory_limit: "4GB"
  temp_directory: "output/duckdb_tmp"

ingest:
  max_workers: 1
  log_every_dates: 1
  allow_missing_dates: true
  csv:
    header: true
    auto_detect: true
    sample_size: 20000
    ignore_errors: false
